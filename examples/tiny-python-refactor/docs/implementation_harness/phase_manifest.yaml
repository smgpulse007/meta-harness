protocol_version: 0.1.0
project: tiny-python-refactor
phases:
  - id: phase_001
    title: Python example phase
    source_spec_refs:
      - docs/implementation_spec.md
    input_checkpoints: []
    output_checkpoint: .meta-harness/checkpoints/phase_001
    acceptance_criteria:
      - Python tests pass.
    validation_commands:
      - id: pytest
        command: python -m pytest
        required: true
    allowed_terminal_statuses:
      - complete
      - complete_pending_human_review
      - pass_with_risks
      - blocked
      - failed
    human_acceptance_required: false
    side_effect_policy: default
    slices:
      - phase_001_slice_001
    depends_on: []
