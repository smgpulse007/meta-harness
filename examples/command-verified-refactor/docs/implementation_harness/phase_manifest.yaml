protocol_version: 0.1.0
project: command-verified-refactor
phases:
  - id: phase_001
    title: Add safe addition
    source_spec_refs:
      - docs/implementation_spec.md
    input_checkpoints: []
    output_checkpoint: .meta-harness/checkpoints/phase_001
    acceptance_criteria:
      - add(a, b) returns a numeric sum.
      - node --test tests/math.node-test.mjs exits 0.
    validation_commands:
      - id: node-test
        command: node --test tests/math.node-test.mjs
        required: true
    allowed_terminal_statuses:
      - complete
      - complete_pending_human_review
      - pass_with_risks
      - blocked
      - failed
    human_acceptance_required: false
    side_effect_policy: default
    slices:
      - phase_001_slice_001
    depends_on: []
