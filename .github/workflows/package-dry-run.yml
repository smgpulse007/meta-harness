name: Package Dry Run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-dry-run:
    name: Package dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: pnpm run build
      - run: pnpm --filter @meta-harness/core pack --dry-run
      - run: pnpm --filter @meta-harness/adapters pack --dry-run
      - run: pnpm --filter @meta-harness/cli pack --dry-run
      - run: pnpm --filter @meta-harness/mcp-server pack --dry-run
