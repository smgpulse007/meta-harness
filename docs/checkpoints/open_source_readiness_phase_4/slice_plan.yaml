protocol_version: 0.1.0
phase_id: open_source_readiness_phase_4
phase_objective: Add token-budgeting, context-pack, and evidence-excerpt implementation needed for Track D.
slices:
  - id: phase4_budget_context
    objective: Implement mh budget, bounded role-aware context packs, mh summarize-log, schemas, samples, tests, docs, and CI budget wiring.
    status: complete
    allowed_write_scope:
      - package.json
      - packages/cli/src/**
      - packages/cli/tests/**
      - scripts/**
      - schemas/**
      - docs/**
    forbidden_write_scope:
      - .git/**
      - node_modules/**
      - dist/**
      - .secrets/**
      - "**/*.tgz"
    validation:
      - pnpm install --frozen-lockfile
      - pnpm run clean
      - pnpm run ci
      - pnpm docs:build
      - pnpm audit --prod
      - pnpm --filter @meta-harness/core pack --dry-run
      - pnpm --filter @meta-harness/adapters pack --dry-run
      - pnpm --filter @meta-harness/cli pack --dry-run
      - pnpm --filter @meta-harness/mcp-server pack --dry-run
      - node packages/cli/dist/index.js budget --json
      - node packages/cli/dist/index.js context-pack --target codex --role worker --budget 8000 --format markdown
      - node packages/cli/dist/index.js context-pack --target claude-code --role reviewer --budget 8000 --format markdown
      - node packages/cli/dist/index.js context-pack --target generic --role worker --budget 8000 --format markdown
      - node packages/cli/dist/index.js summarize-log --input docs/examples/evidence-excerpts/sample-command-output.txt --command "pnpm test" --exit-code 0 --timestamp "2026-07-07T00:00:00.000Z" --format json --max-lines 4
      - git diff --check
      - pnpm exec prettier --check --ignore-unknown -- <changed files>
    output_packet: docs/checkpoints/open_source_readiness_phase_4/subagent_packets/phase4_budget_context.packet.yaml
