blocking_risks:
  - GitHub Pages accessibility is blocked by GitHub plan/repository visibility; the Pages API returned HTTP 422 for Actions-based Pages enablement.
required_validation_preface:
  - If merged, dispatch the manual Release Dry Run workflow on main and record hosted evidence.
  - Resolve the GitHub Pages plan/visibility blocker before claiming the overall goal complete.
